---
name: CI-CD RESTCONF

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Build - lint
        run: |
          yamllint config .github
          flake8 src tests --max-line-length 100

      - name: Test - unitarias
        run: pytest -q

  deploy:
    needs: build-test
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - name: Despliegue pendiente de VPN
        run: echo "Despliegue RESTCONF pendiente de ejecutar con VPN"
